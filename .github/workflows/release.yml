name: Release

# Runs on a v* tag:
#   scan -> build and push -> Trivy digest scan -> SBOM, sign, attest
#        -> deploy to kind (verify, Vault, admission tests, smoke test)
#        -> GitHub release with the SBOM attached
# The GitHub release is created only when every earlier stage is green.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  security-scan:
    uses: ./.github/workflows/security-scan.yml
    with:
      image-name: "devsecops-demo"
      registry: "ghcr.io/ignatius-kevin-wijaya"
    permissions:
      contents: read
      security-events: write

  build-push:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.export-image-ref.outputs.image-ref }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/ignatius-kevin-wijaya/devsecops-demo

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest image ref
        id: export-image-ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "image-ref=ghcr.io/ignatius-kevin-wijaya/devsecops-demo@${DIGEST}" >> "$GITHUB_OUTPUT"

  trivy-release-image:
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Trivy scan of the pushed digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          # GHCR packages are private until made public; these let Trivy pull either way.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.69.3
          image-ref: ${{ needs.build-push.outputs.image-ref }}
          format: sarif
          output: trivy-release-critical.sarif
          severity: CRITICAL
          # Without this, trivy-action drops the severity filter for SARIF output,
          # so exit-code would also fail on LOW, MEDIUM and HIGH findings.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Upload Trivy release SARIF
        if: always() && hashFiles('trivy-release-critical.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-release-critical.sarif
          category: trivy-release-critical

  sign:
    needs:
      - build-push
      - trivy-release-image
    uses: ./.github/workflows/image-sign.yml
    with:
      image-ref: ${{ needs.build-push.outputs.image-ref }}
      registry: ghcr.io
    permissions:
      contents: read
      packages: write
      id-token: write

  deploy:
    needs:
      - build-push
      - sign
    uses: ./.github/workflows/deploy.yml
    with:
      image-ref: ${{ needs.build-push.outputs.image-ref }}
    permissions:
      contents: read
      packages: read
      id-token: write

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-push
      - sign
      - deploy
    permissions:
      contents: write

    steps:
      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.outputs.sbom-artifact-name }}
          path: sbom

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE_REF: ${{ needs.build-push.outputs.image-ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sbom_file=$(find sbom -type f -name '*.json' -print -quit)
          test -n "$sbom_file"
          cp "$sbom_file" "sbom-${TAG}.cyclonedx.json"

          identity='^https://github\.com/Ignatius-Kevin-Wijaya/devsecops-hardened-pipeline/\.github/workflows/image-sign\.yml@'
          cat > notes.md <<EOF
          Signed image, SBOM attested, deployed to kind behind Gatekeeper by [this release run](${RUN_URL}):

          \`\`\`
          ${IMAGE_REF}
          \`\`\`

          The CycloneDX SBOM is attached below. To verify the signature yourself:

          \`\`\`
          cosign verify --certificate-identity-regexp '${identity}' --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository ${GITHUB_REPOSITORY} ${IMAGE_REF}
          \`\`\`
          EOF

          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "sbom-${TAG}.cyclonedx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            "${prerelease[@]}"

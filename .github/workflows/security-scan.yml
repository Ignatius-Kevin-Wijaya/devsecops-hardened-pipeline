name: Security Scan

# Reusable. Called from this repository by ci.yml and release.yml, and from
# other repositories like this:
#
#   uses: Ignatius-Kevin-Wijaya/devsecops-hardened-pipeline/.github/workflows/security-scan.yml@<tag>
#   with:
#     image-name: my-app
#     registry: ghcr.io/my-org
#     policy-ref: <same tag>   # shared Semgrep rules and Gitleaks config are loaded from it

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name for the local scan build"
        required: true
        type: string
      registry:
        description: "Registry prefix for the local scan build tag"
        required: true
        type: string
      source-path:
        description: "Application source scanned by Semgrep"
        required: false
        default: "src/"
        type: string
      k8s-path:
        description: "Kubernetes manifests scanned by Trivy"
        required: false
        default: "k8s/"
        type: string
      dockerfile:
        description: "Dockerfile that is built and scanned"
        required: false
        default: "Dockerfile"
        type: string
      build-context:
        description: "Docker build context"
        required: false
        default: "."
        type: string
      trivyignore:
        description: "Trivy ignore file in the caller's repository"
        required: false
        default: ".trivyignore"
        type: string
      policy-repository:
        description: "Repository holding the shared Semgrep rules and Gitleaks config"
        required: false
        default: "Ignatius-Kevin-Wijaya/devsecops-hardened-pipeline"
        type: string
      policy-ref:
        description: >-
          Ref of policy-repository to load the shared rules from. Leave empty only
          when the caller is policy-repository itself; other callers pass the ref
          they pin this workflow to.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  git-leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require policy-ref for cross-repository calls
        if: inputs.policy-ref == '' && github.repository != inputs.policy-repository
        run: |
          echo "::error::Set the policy-ref input to the ref you pinned this workflow to."
          exit 1

      - name: Check out shared policies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.policy-ref == '' && github.repository || inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .devsecops-policy
          sparse-checkout: policies/semgrep
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks — full history scan
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .devsecops-policy/.gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --exit-code 1 || GITLEAKS_EXIT=$?

          if [ ! -f gitleaks-report.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gitleaks","version":"8.18.4","rules":[]}},"results":[]}]}' \
              > gitleaks-report.sarif
          fi

          exit ${GITLEAKS_EXIT:-0}

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SOURCE_PATH: ${{ inputs.source-path }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require policy-ref for cross-repository calls
        if: inputs.policy-ref == '' && github.repository != inputs.policy-repository
        run: |
          echo "::error::Set the policy-ref input to the ref you pinned this workflow to."
          exit 1

      - name: Check out shared policies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.policy-ref == '' && github.repository || inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .devsecops-policy
          sparse-checkout: policies/semgrep
          persist-credentials: false

      - name: Install Semgrep
        run: pip install semgrep==1.67.0

      - name: Run Semgrep — blocking rules (secrets)
        run: |
          semgrep scan \
            --config p/secrets \
            --sarif --output semgrep-secrets.sarif \
            --error \
            "$SOURCE_PATH"

      - name: Run Semgrep — custom taint rules (blocking)
        run: |
          semgrep scan \
            --config .devsecops-policy/policies/semgrep/ \
            --sarif --output semgrep-custom.sarif \
            --error \
            "$SOURCE_PATH"

      - name: Run Semgrep — advisory rules (non-blocking)
        run: |
          semgrep scan \
            --config p/python \
            --sarif --output semgrep-advisory.sarif \
            --no-error \
            "$SOURCE_PATH" || true

      - name: Upload Semgrep SARIF — secrets
        if: always() && hashFiles('semgrep-secrets.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: semgrep-secrets.sarif
          category: semgrep-secrets

      - name: Upload Semgrep SARIF — custom rules
        if: always() && hashFiles('semgrep-custom.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: semgrep-custom.sarif
          category: semgrep-custom

      - name: Upload Semgrep SARIF — advisory
        if: always() && hashFiles('semgrep-advisory.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: semgrep-advisory.sarif
          category: semgrep-advisory

  trivy-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SCAN_IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      BUILD_CONTEXT: ${{ inputs.build-context }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: |
          docker build -f "$DOCKERFILE" -t "$SCAN_IMAGE" "$BUILD_CONTEXT"

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.69.3"
          mkdir -p "$HOME/.local/bin"
          curl -sfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      - name: Trivy image scan — CRITICAL summary
        if: always()
        run: |
          trivy image \
            --scanners vuln \
            --skip-version-check \
            --ignore-unfixed \
            --severity CRITICAL \
            "$SCAN_IMAGE" || true

      - name: Trivy image scan — CRITICAL with fix available (blocking)
        run: |
          set +e
          trivy image \
            --scanners vuln \
            --skip-version-check \
            --ignore-unfixed \
            --severity CRITICAL \
            --format sarif \
            --output trivy-critical.sarif \
            "$SCAN_IMAGE"
          TRIVY_EXIT=$?

          if [ ! -f trivy-critical.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' \
              > trivy-critical.sarif
          fi

          exit $TRIVY_EXIT

      - name: Trivy image scan — HIGH,MEDIUM advisory
        if: always()
        run: |
          trivy image \
            --scanners vuln \
            --skip-version-check \
            --ignore-unfixed \
            --severity HIGH,MEDIUM \
            --format sarif \
            --output trivy-advisory.sarif \
            "$SCAN_IMAGE" || true

          if [ ! -f trivy-advisory.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' \
              > trivy-advisory.sarif
          fi

      - name: Upload Trivy SARIF — critical
        if: always() && hashFiles('trivy-critical.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-critical.sarif
          category: trivy-critical

      - name: Upload Trivy SARIF — advisory
        if: always() && hashFiles('trivy-advisory.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-advisory.sarif
          category: trivy-advisory

  trivy-iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      K8S_PATH: ${{ inputs.k8s-path }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      TRIVYIGNORE: ${{ inputs.trivyignore }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.69.3"
          mkdir -p "$HOME/.local/bin"
          curl -sfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      - name: Trivy IaC scan — Kubernetes manifests summary
        if: always()
        run: |
          trivy config \
            --skip-version-check \
            --severity CRITICAL,HIGH \
            --ignorefile "$TRIVYIGNORE" \
            "$K8S_PATH" || true

      - name: Trivy IaC scan — Kubernetes manifests
        run: |
          set +e
          trivy config \
            --skip-version-check \
            --severity CRITICAL,HIGH \
            --ignorefile "$TRIVYIGNORE" \
            --format sarif \
            --output trivy-iac-k8s.sarif \
            "$K8S_PATH"
          TRIVY_EXIT=$?

          if [ ! -f trivy-iac-k8s.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' \
              > trivy-iac-k8s.sarif
          fi

          exit $TRIVY_EXIT

      - name: Trivy IaC scan — Dockerfile
        if: always()
        run: |
          trivy config \
            --skip-version-check \
            --ignorefile "$TRIVYIGNORE" \
            --format sarif \
            --output trivy-iac-docker.sarif \
            "$DOCKERFILE" || true

          if [ ! -f trivy-iac-docker.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' \
              > trivy-iac-docker.sarif
          fi

      - name: Upload Trivy IaC SARIF — Kubernetes
        if: always() && hashFiles('trivy-iac-k8s.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-iac-k8s.sarif
          category: trivy-iac-k8s

      - name: Upload Trivy IaC SARIF — Dockerfile
        if: always() && hashFiles('trivy-iac-docker.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-iac-docker.sarif
          category: trivy-iac-dockerfile
